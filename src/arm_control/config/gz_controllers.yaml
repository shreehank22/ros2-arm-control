controller_manager:
  ros__parameters:
    update_rate: 1000  # matches controller_node's 1 kHz loop and Gazebo's 1 ms physics step

    effort_controller:
      type: forward_command_controller/ForwardCommandController
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: parallel_gripper_action_controller/GripperActionController


# order must match controller_node's joint order (model order: fr3_joint1..7);
# the controller publishes a plain array and this list maps each value to a joint
effort_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    interface_name: effort

# no joint list: broadcasts every joint in ros2_control, the finger included
joint_state_broadcaster:
  ros__parameters: {}

# Franka Hand: ParallelGripperCommand action on /hand_controller/gripper_cmd. The position is
# fr3_finger_joint1 in metres (0 = closed, 0.04 = open, so the opening is twice the position);
# fr3_finger_joint2 follows it as a mimic joint (see the ros2_control block in fr3.urdf).
hand_controller:
  ros__parameters:
    joint: fr3_finger_joint1
